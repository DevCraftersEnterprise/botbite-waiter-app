<div class="section-spacing">
  <div class="page-header">
    <shared-title title="Menús" description="Administra la sucursal seleccionada" />

    <div class="actions-bar">
      <button
        class="btn-primary btn-full"
        (click)="openCreate()"
        [disabled]="!branchId()"
        aria-label="Crear nuevo menú"
      >
        <div class="flex items-center justify-center gap-2">
          <lucide-icon
            [img]="iconsService.add"
            size="15"
            color="white"
            aria-hidden="true"
          ></lucide-icon>
          <span> Nuevo menú </span>
        </div>
      </button>
    </div>
  </div>

  <div class="search-bar">
    <div class="flex items-center gap-2">
      <label for="menusSearch" class="sr-only">Buscar menús</label>
      <lucide-icon
        [img]="iconsService.search"
        size="15"
        color="black"
        aria-hidden="true"
      ></lucide-icon>
      <input
        id="menusSearch"
        type="text"
        placeholder="Buscar..."
        class="flex-1 rounded-xl border border-black/10 px-3 py-2 md:w-64"
        [value]="searchTerm()"
        (input)="updateFilterSearch($event)"
        aria-label="Buscar menús"
      />
    </div>
    <select
      class="select-full"
      [value]="activeFilterValue()"
      (change)="updateFilterActive($event)"
      aria-label="Filtrar por estado"
    >
      <option value="">Todos</option>
      <option value="true">Activos</option>
      <option value="false">Inactivos</option>
    </select>
  </div>

  <div class="table-container">
    <table class="min-w-[800px] table-fixed">
      <thead class="bg-neutral-50 text-neutral-600">
        <tr>
          <th class="w-1/5 px-4 py-3 text-left font-medium">Nombre</th>
          <th class="w-32 px-4 py-3 text-left font-medium">PDF</th>
          <th class="w-28 px-4 py-3 text-left font-medium">Estado</th>
          <th class="px-4 py-3 text-right font-medium">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (menu of menus(); track menu.id) {
          <tr class="animate-fade-in animate-duration-300 border-t border-black/10">
            <td class="w-1/5 truncate px-4 py-3" [title]="menu.name">{{ menu.name }}</td>
            <td class="w-32 px-4 py-3">
              <div class="flex items-center gap-2">
                @if (!menu.pdfLink) {
                  <span class="text-sm font-medium text-red-600">No cargado</span>
                } @else {
                  <button
                    (click)="downloadPdf(menu)"
                    class="btn-table-primary"
                    [attr.aria-label]="'Descargar PDF del menú ' + menu.name"
                    [title]="'Descargar PDF del menú ' + menu.name"
                  >
                    <div class="flex items-center gap-2">
                      <lucide-icon
                        [img]="iconsService.downloadFile"
                        size="15"
                        color="blue"
                      ></lucide-icon>
                      <span class="hidden text-xs 2xl:inline"> Descargar </span>
                    </div>
                  </button>
                }
              </div>
            </td>
            <td class="w-28 px-4 py-3">
              <div
                class="inline-flex items-center gap-2 rounded-full border px-2 py-1 text-xs"
                [class]="
                  menu.isActive
                    ? 'border-green-200 bg-green-100 text-green-800'
                    : 'border-red-200 bg-red-100 text-red-800'
                "
              >
                <lucide-icon
                  [img]="menu.isActive ? iconsService.active : iconsService.inactive"
                  size="20"
                  [color]="menu.isActive ? 'green' : 'red'"
                ></lucide-icon>

                <span class="">
                  {{ menu.isActive ? 'Activo' : 'Inactivo' }}
                </span>
              </div>
            </td>
            <td class="px-4 py-3">
              <div class="flex flex-wrap items-center justify-end gap-2">
                <!-- Cargar menú -->
                <input
                  #pdfInput
                  type="file"
                  accept=".pdf,application/pdf"
                  class="hidden"
                  (change)="onPdfSelected($event, menu.id)"
                />
                <button class="btn-table-neutral" (click)="pdfInput.click()">
                  <div class="flex items-center justify-center gap-1">
                    <lucide-icon
                      [img]="iconsService.uploadFile"
                      size="15"
                      color="green"
                    ></lucide-icon>
                    <span class="hidden text-xs 2xl:inline"> Cargar menú </span>
                  </div>
                </button>
                <!-- Ver items del menú -->
                <button
                  class="btn-table-primary"
                  (click)="viewProducts(menu)"
                  [attr.aria-label]="'Ver productos del menú ' + menu.name"
                  [title]="'Ver productos del menú ' + menu.name"
                >
                  <div class="flex items-center justify-center gap-1">
                    <lucide-icon [img]="iconsService.eye" size="15" color="blue"></lucide-icon>
                    <span class="hidden text-xs 2xl:inline">Productos</span>
                  </div>
                </button>
                <!-- Editar -->
                <button
                  class="btn-table-warning"
                  (click)="openEdit(menu)"
                  [attr.aria-label]="'Editar menú ' + menu.name"
                  [title]="'Editar menú ' + menu.name"
                >
                  <div class="flex items-center justify-center gap-1">
                    <lucide-icon [img]="iconsService.edit" size="15" color="orange"></lucide-icon>
                    <span class="hidden text-xs 2xl:inline">Editar</span>
                  </div>
                </button>
                <!-- Desactivar/Activar -->
                <button
                  class="btn-table"
                  [class.btn-table-danger]="menu.isActive"
                  [class.btn-table-success]="!menu.isActive"
                  [attr.aria-label]="(menu.isActive ? 'Desactivar ' : 'Activar ') + menu.name"
                  [title]="(menu.isActive ? 'Desactivar ' : 'Activar ') + menu.name"
                  (click)="confirmToggle(menu, menu.isActive)"
                >
                  <div class="flex items-center justify-center gap-1">
                    <lucide-icon
                      [img]="menu.isActive ? iconsService.disable : iconsService.active"
                      size="15"
                      [color]="menu.isActive ? 'red' : 'green'"
                    ></lucide-icon>
                    <span class="hidden text-xs 2xl:inline">{{
                      menu.isActive ? 'Desactivar' : 'Activar'
                    }}</span>
                  </div>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <app-empty-state
            [loading]="loading()"
            [isEmpty]="menus().length === 0"
            [colspan]="3"
            message="No hay menús para mostrar."
          />
        }
      </tbody>
    </table>
  </div>

  <app-pagination
    [total]="total()"
    [pageFrom]="pageFrom()"
    [pageTo]="pageTo()"
    [canPrev]="canPrev()"
    [canNext]="canNext()"
    (previousPage)="prevPage()"
    (nextPage)="nextPage()"
    (limitChange)="changeLimit($event)"
  />

  <app-modal
    [isOpen]="mode() !== null"
    [title]="modalTitle()"
    [maxWidth]="'max-w-2xl'"
    [showActions]="true"
    [loading]="saving()"
    [confirmDisabled]="!isFormValid()"
    confirmText="Guardar"
    (close)="closeModal()"
    (cancel)="closeModal()"
    (confirm)="save()"
  >
    <form (submit)="$event.preventDefault()" class="space-y-4">
      <div class="space-y-1">
        <label for="restaurantName" class="text-sm font-medium">Nombre</label>
        <input
          id="restaurantName"
          type="text"
          class="w-full rounded-xl border border-black/10 px-3 py-2 focus:ring-2 focus:ring-black/20 focus:outline-none"
          [value]="form().name"
          (input)="updateForm('name', $event)"
          required
          maxlength="80"
          aria-required="true"
        />
      </div>

      <div class="flex items-center gap-2">
        <input
          id="active"
          type="checkbox"
          [checked]="form().isActive"
          (change)="updateForm('isActive', $event)"
          class="rounded"
        />
        <label for="active" class="text-sm">Activo</label>
      </div>

      @if (!isFormValid() && form().name) {
        <p class="text-sm text-red-600">El nombre es obligatorio</p>
      }
    </form>
  </app-modal>

  <app-modal
    [isOpen]="confirming()"
    [title]="confirmTitle()"
    [maxWidth]="'max-w-sm'"
    [showActions]="true"
    confirmText="Confirmar"
    (close)="closeConfirmation()"
    (cancel)="closeConfirmation()"
    (confirm)="toggleActive()"
  >
    <p class="text-sm text-neutral-600">{{ confirmMessage() }}</p>
  </app-modal>
</div>
